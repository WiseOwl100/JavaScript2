<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Categorizer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <h1>Grade Categorizer</h1>
    <div id="inputs">
        <input type="number" id="score1" placeholder="Enter score 1">
        <input type="number" id="score2" placeholder="Enter score 2">
        <input type="number" id="score3" placeholder="Enter score 3">

    </div>
    <ul id="gradeList"></ul>
</body>
</html>
